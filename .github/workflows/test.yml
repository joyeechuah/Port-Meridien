# Runs the automated browser tests on every push to main and on every pull request.
# The game itself needs no build; Node and Playwright are only used here, for testing.
name: Tests

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  shards:
    name: Chromium shard ${{ matrix.shard }}/4
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install test dependencies
        run: npm ci

      - name: Check the game's code (ESLint)
        run: npm run lint

      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium

      # Playwright starts the local server itself (tests/support/server.js, see playwright.config.js),
      # and the job fails if any test fails
      # Shard each project separately so the slower software-rendered tests run on all four runners.
      - name: Run both projects and summarise each report
        env:
          SHARD: ${{ matrix.shard }}
        run: |
          status=0
          for project in chromium webgl; do
            npx playwright test --project="$project" --shard="$SHARD/4" || status=1
            echo "## $project · shard $SHARD/4" >> "$GITHUB_STEP_SUMMARY"
            node tests/support/summary.js >> "$GITHUB_STEP_SUMMARY"
            mkdir -p "reports/$project"
            for dir in playwright-report test-results; do
              if [ -d "$dir" ]; then mv "$dir" "reports/$project/"; fi
            done
          done
          exit "$status"

      # the HTML report, with screenshots and traces for any test that failed
      - name: Upload the report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v6
        with:
          name: playwright-report-${{ matrix.shard }}
          path: reports/
          retention-days: 14

  chromium:
    name: Playwright (Chromium)
    needs: shards
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Require every shard to pass
        env:
          SHARD_RESULT: ${{ needs.shards.result }}
        run: test "$SHARD_RESULT" = success
