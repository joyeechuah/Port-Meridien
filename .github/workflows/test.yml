# Runs the automated browser tests on every push to main and on every pull request.
# The game itself needs no build; Node and Playwright are only used here, for testing.
name: Tests

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  shards:
    name: Chromium shard ${{ matrix.shard }}/6
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install test dependencies
        run: npm ci

      - name: Check the game's code (ESLint)
        run: npm run lint

      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium

      - name: Balance the test files by measured running time
        env:
          SHARD_COUNT: ${{ strategy.job-total }}
        run: node tests/support/ci-shards.js "$RUNNER_TEMP/test-lists" "$SHARD_COUNT"

      - name: Run the assigned Chromium and WebGL tests
        env:
          SHARD: ${{ matrix.shard }}
        run: npx playwright test --test-list="$RUNNER_TEMP/test-lists/$SHARD"

      # the Node driving simulator (8 s, no browser), on one shard only
      - name: Run the driving simulator
        if: ${{ !cancelled() && matrix.shard == 2 }}
        run: npm run test:physics

      - name: Summarise results
        if: ${{ !cancelled() }}
        run: node tests/support/summary.js >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v6
        with:
          name: playwright-report-${{ matrix.shard }}
          path: |
            playwright-report/
            test-results/
          retention-days: 14

  chromium:
    name: Playwright (Chromium)
    needs: shards
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Require every shard to pass
        env:
          SHARD_RESULT: ${{ needs.shards.result }}
        run: test "$SHARD_RESULT" = success
